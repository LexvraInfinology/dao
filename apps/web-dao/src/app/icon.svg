<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#071330"/>
      <stop offset="50%" stop-color="#0A1845"/>
      <stop offset="100%" stop-color="#050C22"/>
    </linearGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#155EEF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Crystal Ambient Glow -->
    <radialGradient id="crystalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#155EEF" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#071330" stop-opacity="0"/>
    </radialGradient>

    <!-- Facet Gradients -->
    <linearGradient id="facetTopCenter" x1="256" y1="110" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="facetTopLeft" x1="160" y1="170" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <linearGradient id="facetTopRight" x1="352" y1="170" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>

    <linearGradient id="facetBottomCenter" x1="256" y1="256" x2="256" y2="402" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0F2B66"/>
    </linearGradient>

    <linearGradient id="facetBottomLeft" x1="160" y1="340" x2="256" y2="402" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#09183C"/>
    </linearGradient>

    <linearGradient id="facetBottomRight" x1="352" y1="340" x2="256" y2="402" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0A1D4A"/>
    </linearGradient>

    <!-- Sparkle Accent Gradient -->
    <linearGradient id="sparkleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base with Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="url(#borderGrad)" stroke-width="8"/>

  <!-- Radial Crystal Glow Behind Shape -->
  <circle cx="256" cy="256" r="170" fill="url(#crystalGlow)"/>

  <!-- Orbital Ring (Subtle futuristic accent) -->
  <ellipse cx="256" cy="256" rx="160" ry="60" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.3" transform="rotate(-25 256 256)"/>

  <!-- Main 3D Multifaceted Crystal Jewel -->
  <g filter="url(#neonGlow)">
    <!-- Top Apex Facets -->
    <polygon points="256,110 148,256 256,256" fill="url(#facetTopLeft)"/>
    <polygon points="256,110 364,256 256,256" fill="url(#facetTopRight)"/>

    <!-- Bottom Apex Facets -->
    <polygon points="256,402 148,256 256,256" fill="url(#facetBottomLeft)"/>
    <polygon points="256,402 364,256 256,256" fill="url(#facetBottomRight)"/>

    <!-- Inner Central Core Diamond for Multi-Depth 3D Appearance -->
    <polygon points="256,160 200,256 256,352 312,256" fill="url(#facetTopCenter)" fill-opacity="0.4"/>

    <!-- Illuminated Crystalline Edge Lines -->
    <polygon points="256,110 364,256 256,402 148,256" fill="none" stroke="#7DD3FC" stroke-width="5" stroke-linejoin="round"/>
    <line x1="148" y1="256" x2="364" y2="256" stroke="#BAE6FD" stroke-width="4" stroke-linecap="round"/>
    <line x1="256" y1="110" x2="256" y2="402" stroke="#BAE6FD" stroke-width="3" stroke-linecap="round" stroke-opacity="0.75"/>

    <line x1="256" y1="160" x2="200" y2="256" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.8"/>
    <line x1="200" y1="256" x2="256" y2="352" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.8"/>
    <line x1="256" y1="352" x2="312" y2="256" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.8"/>
    <line x1="312" y1="256" x2="256" y2="160" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.8"/>
  </g>

  <!-- Diamond Sparkle Accents -->
  <polygon points="380,120 392,132 380,144 368,132" fill="url(#sparkleGrad)"/>
  <polygon points="126,368 136,378 126,388 116,378" fill="url(#sparkleGrad)" fill-opacity="0.75"/>
  <circle cx="256" cy="256" r="4" fill="#FFFFFF"/>
</svg>
