# ==============================================================================
# EQUORA ECOSYSTEM — PRODUCTION NGINX REVERSE PROXY WITH FULL SSL / TLS
# Location on Utho VM: /etc/nginx/sites-available/equora.conf (or equora-ssl.conf)
# Enable: ln -sf /etc/nginx/sites-available/equora-ssl.conf /etc/nginx/sites-enabled/equora.conf
# Reload: nginx -t && systemctl reload nginx
# ==============================================================================

# Common proxy headers map
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Gzip compression for high-performance asset delivery
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

# ==============================================================================
# HTTP (PORT 80) -> HTTPS (PORT 443) REDIRECTS WITH ACME CHALLENGE SUPPORT
# ==============================================================================

# 1. HTTP Redirect for DAO
server {
    listen 80;
    listen [::]:80;
    server_name equorafidao.com www.equorafidao.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTP Redirect for Matrix
server {
    listen 80;
    listen [::]:80;
    server_name equorafimatrix.com www.equorafimatrix.com equorafi.com www.equorafi.com matrix.equorafidao.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 3. HTTP Redirect for Unified API
server {
    listen 80;
    listen [::]:80;
    server_name api.equorafidao.com api.equorafimatrix.com api.equorafi.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================================================
# HTTPS (PORT 443) — PRODUCTION SSL / TLS REVERSE PROXY SERVERS
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. EQUORA DAO FRONTEND (equorafidao.com) -> Port 3000
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name equorafidao.com www.equorafidao.com;

    # SSL Certificates (Managed by Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/equorafidao.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/equorafidao.com/privkey.pem;

    # Modern TLS Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 20M;

    # Next.js static asset caching (immutable files)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Timeouts & Buffering
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}

