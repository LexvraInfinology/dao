# ==============================================================================
# EQUORA ECOSYSTEM — PRODUCTION NGINX REVERSE PROXY CONFIGURATION
# Location on Utho VM: /etc/nginx/sites-available/equora.conf
# Enable: ln -s /etc/nginx/sites-available/equora.conf /etc/nginx/sites-enabled/
# Reload: nginx -t && systemctl reload nginx
# ==============================================================================

# Common proxy headers map
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ------------------------------------------------------------------------------
# 1. EQUORA DAO FRONTEND (equorafidao.com) -> Port 3000
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name equorafidao.com www.equorafidao.com;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts & Buffering
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}

# ------------------------------------------------------------------------------
# 2. EQUORA MATRIX FRONTEND (equorafi.com / matrix.equorafidao.com) -> Port 3001
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name equorafi.com www.equorafi.com matrix.equorafidao.com;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts & Buffering
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}

# ------------------------------------------------------------------------------
# 3. UNIFIED EQUORA BACKEND API (api.equorafidao.com) -> Port 4000
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.equorafidao.com;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # WebSocket support (for realtime events)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }
}
