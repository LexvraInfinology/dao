# ==============================================================================
# EQUORA ECOSYSTEM — PRODUCTION NGINX REVERSE PROXY CONFIGURATION (HTTP + ACME)
# Location on Utho VM: /etc/nginx/sites-available/equora.conf
# Enable: ln -s /etc/nginx/sites-available/equora.conf /etc/nginx/sites-enabled/
# Reload: nginx -t && systemctl reload nginx
#
# NOTE: For HTTPS/SSL production termination, use deploy/nginx/equora-ssl.conf
# or run scripts/deploy/setup-ssl.sh to automatically issue certificates.
# ==============================================================================

# Common proxy headers map
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Gzip compression for high-performance asset delivery
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

# ------------------------------------------------------------------------------
# 1. EQUORA DAO FRONTEND (equorafidao.com) -> Port 3000
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name equorafidao.com www.equorafidao.com;

    client_max_body_size 20M;

    # ACME Challenge for Let's Encrypt / Certbot renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Next.js static asset caching
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Timeouts & Buffering
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}

