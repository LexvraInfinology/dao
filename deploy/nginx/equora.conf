# ------------------------------------------------------------------------------
# 3. UNIFIED EQUORA BACKEND API (api.equorafidao.com) -> Port 4000
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.equorafidao.com api.equorafimatrix.com api.equorafi.com;

    client_max_body_size 50M;

    # ACME Challenge for Let's Encrypt / Certbot renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # WebSocket support (for realtime events)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Timeouts for API calls & WebSockets
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }
}
