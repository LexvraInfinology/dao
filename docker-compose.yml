services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neondb_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-npg_1fOkpFHAZx2e}
      POSTGRES_DB: ${POSTGRES_DB:-neondb}
    volumes:
      - equora_pg_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - equora_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-EquoraRedis2026Secure}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-EquoraRedis2026Secure}"]
    volumes:
      - equora_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - equora_network

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.node-service
      args:
        SERVICE_PACKAGE: '@equora/api'
        SERVICE_DIR: apps/api
        SERVICE_PORT: 4000
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://neondb_owner:npg_1fOkpFHAZx2e@ep-ancient-smoke-b4y6grfd-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-EquoraRedis2026Secure}
      REDIS_URL: redis://:${REDIS_PASSWORD:-EquoraRedis2026Secure}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-equora_jwt_secret_production_key_32_characters_minimum}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      SIWE_NONCE_TTL_SECONDS: ${SIWE_NONCE_TTL_SECONDS:-300}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://equorafidao.com,https://www.equorafidao.com,http://equorafidao.com:3000,https://equorafidao.com:3000,https://equorafimatrix.com,https://www.equorafimatrix.com,http://equorafimatrix.com:3001,https://equorafimatrix.com:3001,http://localhost:3000,http://localhost:3001,http://localhost:4000,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:4000}
      CHAIN_ID: ${CHAIN_ID:-1000}
      RPC_URL: ${RPC_URL:-https://fullnode-one.trobchain.com}
      FULLNODE_URL: ${FULLNODE_URL:-https://fullnode-one.trobchain.com}
      NEXT_PUBLIC_DAO_ADDRESS: ${NEXT_PUBLIC_DAO_ADDRESS:-THMrTHkAfcM1ZmhNzNRrMJiyCimgoGjF9V}
      TROB_PRICE_API_URL: ${TROB_PRICE_API_URL:-https://backend.trobchain.com/v1/market/price}
      PRICE_CACHE_TTL_MS: ${PRICE_CACHE_TTL_MS:-30000}
      DAO_SEAT_ENTRY_USD: ${DAO_SEAT_ENTRY_USD:-300}
      CHAINLINK_BTT_USD_FEED: ${CHAINLINK_BTT_USD_FEED:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - equora_network

  indexer:
    build:
      context: .
      dockerfile: docker/Dockerfile.node-service
      args:
        SERVICE_PACKAGE: '@equora/indexer'
        SERVICE_DIR: apps/indexer
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://neondb_owner:npg_1fOkpFHAZx2e@ep-ancient-smoke-b4y6grfd-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require}
      CHAIN_ID: ${CHAIN_ID:-1000}
      RPC_URL: ${RPC_URL:-https://fullnode-one.trobchain.com}
      INDEXER_POLL_INTERVAL_MS: ${INDEXER_POLL_INTERVAL_MS:-3000}
      INDEXER_START_BLOCK: ${INDEXER_START_BLOCK:-0}
      NEXT_PUBLIC_REGISTRY_ADDRESS: ${NEXT_PUBLIC_REGISTRY_ADDRESS:-TUxT2CjgiSUaiTfwaA3nZ8ZnBcugnspZRB}
      NEXT_PUBLIC_TOKEN_ADDRESS: ${NEXT_PUBLIC_TOKEN_ADDRESS:-TS6XGpAtHma98gs8qDHdsh4BZYDEAAGjJt}
      NEXT_PUBLIC_NFT_ADDRESS: ${NEXT_PUBLIC_NFT_ADDRESS:-TSANycxN3mgwxAXLNj7XdhvMvWaXT3WxL9}
      NEXT_PUBLIC_VESTING_ADDRESS: ${NEXT_PUBLIC_VESTING_ADDRESS:-}
      NEXT_PUBLIC_DAO_ADDRESS: ${NEXT_PUBLIC_DAO_ADDRESS:-THMrTHkAfcM1ZmhNzNRrMJiyCimgoGjF9V}
      NEXT_PUBLIC_MATRIX_ADDRESS: ${NEXT_PUBLIC_MATRIX_ADDRESS:-TNjaJr6pHV2uBkBG9sDGtuxo4AAzqHBCJi}
      NEXT_PUBLIC_VAULT_ADDRESS: ${NEXT_PUBLIC_VAULT_ADDRESS:-THoeHcGMEzNDsE8xPZuorTYgV9hje1RkGw}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - equora_network

  queue:
    build:
      context: .
      dockerfile: docker/Dockerfile.node-service
      args:
        SERVICE_PACKAGE: '@equora/queue'
        SERVICE_DIR: apps/queue
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://neondb_owner:npg_1fOkpFHAZx2e@ep-ancient-smoke-b4y6grfd-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-EquoraRedis2026Secure}
      QUEUE_CONCURRENCY: ${QUEUE_CONCURRENCY:-5}
      QUEUE_POLL_INTERVAL_MS: ${QUEUE_POLL_INTERVAL_MS:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - equora_network

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://equorafidao.com}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.equorafidao.com}
        NEXT_PUBLIC_MATRIX_DOMAIN: ${NEXT_PUBLIC_MATRIX_DOMAIN:-equorafidao.com}
        NEXT_PUBLIC_DAO_DOMAIN: ${NEXT_PUBLIC_DAO_DOMAIN:-equorafidao.com}
        NEXT_PUBLIC_MATRIX_URL: ${NEXT_PUBLIC_MATRIX_URL:-https://equorafidao.com}
        NEXT_PUBLIC_DAO_URL: ${NEXT_PUBLIC_DAO_URL:-https://equorafidao.com}
        NEXT_PUBLIC_CHAIN_ID: ${NEXT_PUBLIC_CHAIN_ID:-${CHAIN_ID:-1000}}
        NEXT_PUBLIC_IS_MAINNET: ${NEXT_PUBLIC_IS_MAINNET:-true}
        NEXT_PUBLIC_TARGET_NETWORK: ${NEXT_PUBLIC_TARGET_NETWORK:-mainnet}
        NEXT_PUBLIC_EXPLORER_URL: ${NEXT_PUBLIC_EXPLORER_URL:-https://trobchain.com}
        NEXT_PUBLIC_EXPLORER_API_URL: ${NEXT_PUBLIC_EXPLORER_API_URL:-https://backend.trobchain.com/v1}
        NEXT_PUBLIC_RPC_URL: ${NEXT_PUBLIC_RPC_URL:-https://fullnode-one.trobchain.com}
        NEXT_PUBLIC_WHATSAPP_DAO_GROUP_URL: ${NEXT_PUBLIC_WHATSAPP_DAO_GROUP_URL:-https://chat.whatsapp.com/GR19373Pgq7LezBKtXC0ng}
        NEXT_PUBLIC_OFFICIAL_SR_MAINNET_ADDRESS: ${NEXT_PUBLIC_OFFICIAL_SR_MAINNET_ADDRESS:-TC7LCXJ5qhhw6ewLzK8SJuJiwtWmLExLYY}
        NEXT_PUBLIC_OFFICIAL_SR_TESTNET_ADDRESS: ${NEXT_PUBLIC_OFFICIAL_SR_TESTNET_ADDRESS:-}
        NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID:-7663d51173c43f7ad40158edb7e88859}
        NEXT_PUBLIC_TOKEN_ADDRESS: ${NEXT_PUBLIC_TOKEN_ADDRESS:-TPAGzWMuLbGiKMkvZZkWfg3mbcmGtsLgWn}
        NEXT_PUBLIC_REGISTRY_ADDRESS: ${NEXT_PUBLIC_REGISTRY_ADDRESS:-TUxT2CjgiSUaiTfwaA3nZ8ZnBcugnspZRB}
        NEXT_PUBLIC_NFT_ADDRESS: ${NEXT_PUBLIC_NFT_ADDRESS:-TSANycxN3mgwxAXLNj7XdhvMvWaXT3WxL9}
        NEXT_PUBLIC_DAO_ADDRESS: ${NEXT_PUBLIC_DAO_ADDRESS:-THMrTHkAfcM1ZmhNzNRrMJiyCimgoGjF9V}
        NEXT_PUBLIC_DAO_HEX: ${NEXT_PUBLIC_DAO_HEX:-4151114b92df6041f5a0e7ebc13e6ed68298fd28b0}
        NEXT_PUBLIC_DAO_MEMBERSHIP_ADDRESS: ${NEXT_PUBLIC_DAO_MEMBERSHIP_ADDRESS:-TSANycxN3mgwxAXLNj7XdhvMvWaXT3WxL9}
        NEXT_PUBLIC_VAULT_ADDRESS: ${NEXT_PUBLIC_VAULT_ADDRESS:-THoeHcGMEzNDsE8xPZuorTYgV9hje1RkGw}
        NEXT_PUBLIC_MATRIX_ADDRESS: ${NEXT_PUBLIC_MATRIX_ADDRESS:-TNjaJr6pHV2uBkBG9sDGtuxo4AAzqHBCJi}
        NEXT_PUBLIC_SALARY_POOL_ADDRESS: ${NEXT_PUBLIC_SALARY_POOL_ADDRESS:-TEC2wDpRSbPutaP3URY8m3UieE74Muo5T9}
        NEXT_PUBLIC_MAGIC_BOX_ADDRESS: ${NEXT_PUBLIC_MAGIC_BOX_ADDRESS:-TStE36Pqa72f8hUdemSjtoi1SxpWmrjaYg}
        NEXT_PUBLIC_REWARD_POOL_ADDRESS: ${NEXT_PUBLIC_REWARD_POOL_ADDRESS:-TF6dsLSRY1G9idqpTEM9Xowvdyp7EgFJWh}
        NEXT_PUBLIC_VESTING_ADDRESS: ${NEXT_PUBLIC_VESTING_ADDRESS:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://equorafidao.com}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.equorafidao.com}
      BACKEND_API_URL: ${BACKEND_API_URL:-http://api:4000}
      API_HOST: ${API_HOST:-api.equorafidao.com}
      API_PORT: ${API_PORT:-4000}
      WEB_PORT: ${WEB_PORT:-3000}
      FULLNODE_URL: ${FULLNODE_URL:-https://fullnode-one.trobchain.com}
      RPC_URL: ${RPC_URL:-https://fullnode-one.trobchain.com}
      NEXT_PUBLIC_RPC_URL: ${NEXT_PUBLIC_RPC_URL:-https://fullnode-one.trobchain.com}
      NEXT_PUBLIC_EXPLORER_URL: ${NEXT_PUBLIC_EXPLORER_URL:-https://trobchain.com}
      NEXT_PUBLIC_EXPLORER_API_URL: ${NEXT_PUBLIC_EXPLORER_API_URL:-https://backend.trobchain.com/v1}
      NEXT_PUBLIC_WHATSAPP_DAO_GROUP_URL: ${NEXT_PUBLIC_WHATSAPP_DAO_GROUP_URL:-https://chat.whatsapp.com/GR19373Pgq7LezBKtXC0ng}
      NEXT_PUBLIC_OFFICIAL_SR_TESTNET_ADDRESS: ${NEXT_PUBLIC_OFFICIAL_SR_TESTNET_ADDRESS:-}
      NEXT_PUBLIC_OFFICIAL_SR_MAINNET_ADDRESS: ${NEXT_PUBLIC_OFFICIAL_SR_MAINNET_ADDRESS:-TC7LCXJ5qhhw6ewLzK8SJuJiwtWmLExLYY}
      NEXT_PUBLIC_DAO_ADDRESS: ${NEXT_PUBLIC_DAO_ADDRESS:-THMrTHkAfcM1ZmhNzNRrMJiyCimgoGjF9V}
      NEXT_PUBLIC_DAO_HEX: ${NEXT_PUBLIC_DAO_HEX:-4151114b92df6041f5a0e7ebc13e6ed68298fd28b0}
      NEXT_PUBLIC_TOKEN_ADDRESS: ${NEXT_PUBLIC_TOKEN_ADDRESS:-TPAGzWMuLbGiKMkvZZkWfg3mbcmGtsLgWn}
      NEXT_PUBLIC_REGISTRY_ADDRESS: ${NEXT_PUBLIC_REGISTRY_ADDRESS:-TUxT2CjgiSUaiTfwaA3nZ8ZnBcugnspZRB}
      NEXT_PUBLIC_NFT_ADDRESS: ${NEXT_PUBLIC_NFT_ADDRESS:-TSANycxN3mgwxAXLNj7XdhvMvWaXT3WxL9}
      NEXT_PUBLIC_VAULT_ADDRESS: ${NEXT_PUBLIC_VAULT_ADDRESS:-THoeHcGMEzNDsE8xPZuorTYgV9hje1RkGw}
      NEXT_PUBLIC_MATRIX_ADDRESS: ${NEXT_PUBLIC_MATRIX_ADDRESS:-TNjaJr6pHV2uBkBG9sDGtuxo4AAzqHBCJi}
      TROB_PRICE_API_URL: ${TROB_PRICE_API_URL:-https://backend.trobchain.com/v1/market/price}
      TROBSAFE_APK_URL: ${TROBSAFE_APK_URL:-}
      NEXT_PUBLIC_TROBSAFE_APK_URL: ${NEXT_PUBLIC_TROBSAFE_APK_URL:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - equora_network

  matrix-frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.matrix
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_MATRIX_URL:-${NEXT_PUBLIC_MATRIX_APP_URL:-https://equorafimatrix.com}}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-${NEXT_PUBLIC_MATRIX_API_URL:-https://api.equorafidao.com}}
        NEXT_PUBLIC_MATRIX_DOMAIN: ${NEXT_PUBLIC_MATRIX_DOMAIN:-equorafimatrix.com}
        NEXT_PUBLIC_DAO_DOMAIN: ${NEXT_PUBLIC_DAO_DOMAIN:-equorafidao.com}
        NEXT_PUBLIC_MATRIX_URL: ${NEXT_PUBLIC_MATRIX_URL:-https://equorafimatrix.com}
        NEXT_PUBLIC_DAO_URL: ${NEXT_PUBLIC_DAO_URL:-https://equorafidao.com}
        NEXT_PUBLIC_CHAIN_ID: ${NEXT_PUBLIC_CHAIN_ID:-${CHAIN_ID:-1000}}
        NEXT_PUBLIC_IS_MAINNET: ${NEXT_PUBLIC_IS_MAINNET:-true}
        NEXT_PUBLIC_TARGET_NETWORK: ${NEXT_PUBLIC_TARGET_NETWORK:-mainnet}
        NEXT_PUBLIC_EXPLORER_URL: ${NEXT_PUBLIC_EXPLORER_URL:-https://trobchain.com}
        NEXT_PUBLIC_EXPLORER_API_URL: ${NEXT_PUBLIC_EXPLORER_API_URL:-https://backend.trobchain.com/v1}
        NEXT_PUBLIC_RPC_URL: ${NEXT_PUBLIC_RPC_URL:-https://fullnode-one.trobchain.com}
        NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID:-7663d51173c43f7ad40158edb7e88859}
        NEXT_PUBLIC_TOKEN_ADDRESS: ${NEXT_PUBLIC_TOKEN_ADDRESS:-TPAGzWMuLbGiKMkvZZkWfg3mbcmGtsLgWn}
        NEXT_PUBLIC_REGISTRY_ADDRESS: ${NEXT_PUBLIC_REGISTRY_ADDRESS:-TUxT2CjgiSUaiTfwaA3nZ8ZnBcugnspZRB}
        NEXT_PUBLIC_NFT_ADDRESS: ${NEXT_PUBLIC_NFT_ADDRESS:-TSANycxN3mgwxAXLNj7XdhvMvWaXT3WxL9}
        NEXT_PUBLIC_DAO_ADDRESS: ${NEXT_PUBLIC_DAO_ADDRESS:-THMrTHkAfcM1ZmhNzNRrMJiyCimgoGjF9V}
        NEXT_PUBLIC_VAULT_ADDRESS: ${NEXT_PUBLIC_VAULT_ADDRESS:-THoeHcGMEzNDsE8xPZuorTYgV9hje1RkGw}
        NEXT_PUBLIC_MATRIX_ADDRESS: ${NEXT_PUBLIC_MATRIX_ADDRESS:-TNjaJr6pHV2uBkBG9sDGtuxo4AAzqHBCJi}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_MATRIX_URL:-${NEXT_PUBLIC_MATRIX_APP_URL:-https://equorafimatrix.com}}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-${NEXT_PUBLIC_MATRIX_API_URL:-https://api.equorafidao.com}}
      BACKEND_API_URL: ${BACKEND_API_URL:-http://api:4000}
      NEXT_PUBLIC_CHAIN_ID: ${NEXT_PUBLIC_CHAIN_ID:-1000}
      NEXT_PUBLIC_RPC_URL: ${NEXT_PUBLIC_RPC_URL:-https://fullnode-one.trobchain.com}
      NEXT_PUBLIC_MATRIX_ADDRESS: ${NEXT_PUBLIC_MATRIX_ADDRESS:-TNjaJr6pHV2uBkBG9sDGtuxo4AAzqHBCJi}
      NEXT_PUBLIC_TOKEN_ADDRESS: ${NEXT_PUBLIC_TOKEN_ADDRESS:-TPAGzWMuLbGiKMkvZZkWfg3mbcmGtsLgWn}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${MATRIX_WEB_PORT:-${MATRIX_PORT:-3001}}:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - equora_network
volumes:
  equora_pg_data:
    driver: local
  equora_redis_data:
    driver: local

networks:
  equora_network:
    driver: bridge
