version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: btitan_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-btitan_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-btitan_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-btitan_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - btitan_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-btitan_admin} -d ${POSTGRES_DB:-btitan_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - btitan_network

  redis:
    image: redis:7-alpine
    container_name: btitan_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-btitan_redis_secret}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - btitan_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-btitan_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - btitan_network

volumes:
  btitan_pg_data:
    driver: local
  btitan_redis_data:
    driver: local

networks:
  btitan_network:
    driver: bridge
