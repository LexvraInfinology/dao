# ==============================================================================
# EQUORA PROTOCOL — DUAL-DOMAIN PRODUCTION NGINX REVERSE PROXY
# (docker/nginx-dual-domain.conf)
# ==============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# 1. MATRIX PORTAL — equorafimatrix.com (Port 3001)
server {
    listen 80;
    listen [::]:80;
    server_name equorafimatrix.com www.equorafimatrix.com equorafi.com www.equorafi.com;

    # Redirect all HTTP traffic to HTTPS (in production SSL)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Static assets caching
    location /_next/static {
        proxy_pass http://127.0.0.1:3001;
        proxy_cache_bypass 1;
        proxy_no_cache 1;
        expires 365d;
        access_log off;
    }
}

# 2. DAO PORTAL — equorafidao.com (Port 3000)
server {
    listen 80;
    listen [::]:80;
    server_name equorafidao.com www.equorafidao.com;

    # Redirect all HTTP traffic to HTTPS (in production SSL)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Static assets caching
    location /_next/static {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_bypass 1;
        proxy_no_cache 1;
        expires 365d;
        access_log off;
    }
}

# 3. UNIFIED API — api.equorafidao.com (Port 4000)
server {
    listen 80;
    listen [::]:80;
    server_name api.equorafidao.com api.equorafimatrix.com api.equorafi.com;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # WebSocket support for tRPC subscriptions
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
